# The smallest useful consumer config. Copy it to the root of a
# filesystem driver repository and edit the two required values.

[project]
# Names this consumer's suites on the shared guest every consumer on the
# host uses, and its setup stamp there.
name = "rust-fs-myfs"

[setup]
# Runs as root INSIDE the shared guest when this consumer first joins a
# boot, and again whenever the script changes. Install your filesystem's
# tooling here.
script = "scripts/vm-setup.sh"

[test]
# Optional. Runs on the host, from the repository root, with the guest up,
# as a run of its own; the guest stays up for the next run.
command = "cargo test"
