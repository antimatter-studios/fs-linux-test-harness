version: "3"
chore_min_version: 0.10.0

vars:
  # The harness is a sibling checkout pinned by tag, like every other
  # sibling in the family; `chore siblings` moves it to this ref.
  LINUX_HARNESS_REF: v0.2.0

includes:
  vm:
    taskfile: ../fs-linux-test-harness/vm.chores.yml

# The reaper: stop a VM that nothing cleaned up, on any chore invocation.
lifecycle:
  after_all:
    - ../fs-linux-test-harness/scripts/vm.sh reap

tasks:
  test:
    desc: Test suite, inside a VM session
    # `vm.sh session` runs the command inside a session: the VM the tests
    # boot comes down, and the machine-wide slot is released, when it ends
    # however it ends. A real consumer puts this in the script every tier
    # runs (scripts/test.sh), so a run made outside chore gets it too.
    cmds:
      - ../fs-linux-test-harness/scripts/vm.sh session cargo test
