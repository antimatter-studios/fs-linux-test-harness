name: CI

# WHAT A GREEN RUN PROVES, job by job (README "CI and automated merging"):
#
#   unit            every script parses and is shellcheck-clean; the config
#                   parser, the slot lock, the orchestration (against a
#                   stub engine), the session rules, the Vagrant engine
#                   (against stub vagrant/ssh/ps), the guest deadline, the
#                   Vagrantfile for every host, and the no-filesystem-
#                   specifics contract — all without a VM.
#   smoke-x86_64    a REAL VM boots under KVM through the harness, a
#                   consumer's setup installs its tooling inside it, a
#                   realistic filesystem suite passes, a corrupted image
#                   FAILS, and the slot, hold, reap, teardown and destroy
#                   behave on a real machine.
#   ci-ok           the single required check: green only when every job
#                   above ran and succeeded.

on:
  pull_request:
  # The merge queue's run: main plus the queued pull requests, the run that
  # decides whether they land. The queue reads ci-ok only from a workflow
  # that triggers here.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CHORE_VERSION: "0.11.0"

jobs:
  # Does this change need the full pipeline? rust-fs-core's
  # scripts/code-changed.sh reads the change's paths and says false only when
  # every one is documentation. The change is the pull request's diff, the
  # merge queue group's (its base_sha to its head_sha: what the queue is about
  # to land), or a push to main's (before to after); a tag or a push it cannot
  # diff runs everything. The x86_64 VM smoke test run only when the answer is
  # true, and ci-ok accepts their skip when, and only when, it is false.
  changes:
    name: changes (does this need the full pipeline?)
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.c.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - name: Classify the change
        id: c
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          range=
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            merge_group) range="$MQ_BASE...$MQ_HEAD" ;;
            push)
              case "$REF" in
                refs/heads/*)
                  if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ] &&
                    git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                    range="$PUSH_BEFORE...$PUSH_AFTER"
                  fi ;;
              esac ;;
          esac
          if [ -n "$range" ]; then
            git diff --name-only "$range" | tee changed.txt
            code="$(bash ../rust-fs-core/scripts/code-changed.sh < changed.txt)"
          else
            code=true
          fi
          echo "code=$code ($EVENT${range:+ $range})"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  unit:
    name: unit (VM-free)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-chore
        with:
          version: ${{ env.CHORE_VERSION }}
      - name: Tool versions
        run: |
          bash --version | head -1
          shellcheck --version | sed -n 2p
          ruby --version
      # tests/agents-core.sh runs rust-fs-core's agents-core check in place.
      - name: chore siblings
        run: chore siblings
      - name: chore check
        run: chore check

  smoke-x86_64:
    name: smoke (real VM, x86_64 KVM)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-chore
        with:
          version: ${{ env.CHORE_VERSION }}
      # The same script every consumer's CI runs from its sibling
      # checkout: KVM access, QEMU, Vagrant and vagrant-qemu, pinned.
      - name: KVM, QEMU and Vagrant
        id: vm-host
        run: scripts/ci-setup-linux.sh
      - name: Cache the Vagrant box
        uses: actions/cache@v4
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ steps.vm-host.outputs.box-cache-key }}
      - name: chore host:check
        run: chore host:check
      - name: chore smoke
        run: chore smoke
      - name: Collect results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-x86_64-results
          path: tests/smoke-consumer/.vm-share/results
          if-no-files-found: ignore

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, unit, smoke-x86_64]
    runs-on: ubuntu-latest
    steps:
      - name: Every job ran and succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          # false only for a change to documentation alone: then, and only
          # then, a skipped job is not a failed one.
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "code changed: $CODE"
          bad="$(echo "$NEEDS" | jq -r --arg code "$CODE" '[to_entries[] | select(.value.result != "success" and ($code != "false" or .value.result != "skipped")) | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::not green: $bad (failed, cancelled or skipped)"
            exit 1
          fi
          echo "all required jobs succeeded"
