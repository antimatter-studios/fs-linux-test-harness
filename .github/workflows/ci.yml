name: CI

# WHAT A GREEN RUN PROVES, job by job (README "CI and automated merging"):
#
#   unit-linux,     every script parses and is shellcheck-clean; the config
#   unit-macos      parser, the shared guest's orchestration (against a
#                   stub engine), the session rules, the Vagrant engine
#                   (against stub vagrant/ssh/ps), the guest deadline, the
#                   Vagrantfile for every host, and the no-filesystem-
#                   specifics contract — all without a VM.
#   smoke-x86_64    a REAL VM boots under KVM through the harness, a
#                   consumer's setup installs its tooling inside it, a
#                   realistic filesystem suite passes, a corrupted image
#                   FAILS, and the shared guest, hold, reap, shutdown and
#                   destroy behave on a real machine.
#   smoke-tcg       a REAL VM boots under TCG on an x86_64 runner without
#                   KVM, an x86_64 guest and an emulated ARM64 one, and
#                   each runs a command that names its architecture.
#   ci-ok           the single required check: green only when every job
#                   above ran and succeeded.
#   release         a version tag publishes its CHANGELOG notes as a GitHub
#                   Release, only after ci-ok succeeds.
#
# WHERE EACH JOB RUNS. Every job has a gate job, `<job>-gate`, just before it,
# on the runner gate (`antimatter-vps-gate`): its one step, `runner-gate pick
# <class>`, answers the runner label the job then runs on, ours or GitHub's.
# The gate never fails a job, and a fork's pull request always gets GitHub's
# runner. A gate has its job's `needs` and `if`, so it never picks a runner for
# a job that will not run. The gate refuses any other name than `gate` or
# `<job>-gate`. tests/ci-gates.sh holds every workflow to this shape.

on:
  pull_request:
  # The merge queue's run: main plus the queued pull requests, the run that
  # decides whether they land. The queue reads ci-ok only from a workflow
  # that triggers here.
  merge_group:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# A pull request titled "red:" holds only its failing test, and its run is the
# red evidence: each push to it is a group of its own commit and is never
# cancelled, so the push that adds the fix cannot cancel it (agent-core v8).
# tests/ci-concurrency.sh holds this.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}${{ startsWith(github.event.pull_request.title, 'red:') && format('-red-{0}', github.event.pull_request.head.sha) || '' }}${{ github.ref_type == 'tag' && format('-{0}', github.ref) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, 'red:') }}

permissions:
  contents: read

env:
  CHORE_VERSION: "0.11.0"

jobs:
  # Does this change need the full pipeline? rust-fs-core's
  # scripts/code-changed.sh reads the change's paths and says false only when
  # every one is documentation. The change is the pull request's diff, the
  # merge queue group's (its base_sha to its head_sha: what the queue is about
  # to land), or a push to main's (before to after); a tag or a push it cannot
  # diff runs everything. The x86_64 VM smoke test run only when the answer is
  # true, and ci-ok accepts their skip when, and only when, it is false.
  changes-gate:
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick linux-x64

  changes:
    name: changes (does this need the full pipeline?)
    needs: changes-gate
    runs-on: ${{ needs.changes-gate.outputs.runner }}
    outputs:
      code: ${{ steps.c.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-chore
        with:
          version: ${{ env.CHORE_VERSION }}
      - name: chore siblings
        run: chore siblings
      - name: Classify the change
        id: c
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          range=
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            merge_group) range="$MQ_BASE...$MQ_HEAD" ;;
            push)
              case "$REF" in
                refs/heads/*)
                  if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ] &&
                    git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                    range="$PUSH_BEFORE...$PUSH_AFTER"
                  fi ;;
              esac ;;
          esac
          if [ -n "$range" ]; then
            git diff --name-only "$range" | tee changed.txt
            code="$(bash ../rust-fs-core/scripts/code-changed.sh < changed.txt)"
          else
            code=true
          fi
          echo "code=$code ($EVENT${range:+ $range})"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # The VM-free suite runs once per host, as two jobs rather than a matrix, so
  # each host has its own gate and picks its own runner.
  unit-linux-gate:
    needs: changes
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick linux-x64

  unit-linux:
    name: unit (VM-free, Linux x86_64)
    needs: [changes, unit-linux-gate]
    runs-on: ${{ needs.unit-linux-gate.outputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Our runner's image carries less than GitHub's: the suite's own tools.
      - name: VM-free tools for our runner
        if: runner.environment == 'self-hosted'
        run: |
          sudo -n apt-get update -qq
          sudo -n apt-get install -y --no-install-recommends ruby shellcheck perl coreutils jq procps lsof
      - name: The host uses its system Bash
        run: echo '/bin:/usr/bin:/usr/sbin:/sbin' >> "$GITHUB_PATH"
      - uses: ./.github/actions/install-chore
        with:
          version: ${{ env.CHORE_VERSION }}
      - name: Tool versions
        run: |
          bash --version | head -1
          shellcheck --version | sed -n 2p
          ruby --version
      # tests/agents-core.sh runs rust-fs-core's agents-core check in place.
      - name: chore siblings
        run: chore siblings
      - name: chore check
        run: chore check

  unit-macos-gate:
    needs: changes
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick macos-arm64

  unit-macos:
    name: unit (VM-free, macOS arm64)
    needs: [changes, unit-macos-gate]
    runs-on: ${{ needs.unit-macos-gate.outputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: macOS VM-free tools
        run: |
          brew install shellcheck coreutils bash jq
          echo "FLTH_TEST_GUEST_BASH=$(brew --prefix bash)/bin/bash" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: The host uses its system Bash
        run: echo '/bin:/usr/bin:/usr/sbin:/sbin' >> "$GITHUB_PATH"
      - uses: ./.github/actions/install-chore
        with:
          version: ${{ env.CHORE_VERSION }}
      - name: Tool versions
        run: |
          bash --version | head -1
          shellcheck --version | sed -n 2p
          ruby --version
      # tests/agents-core.sh runs rust-fs-core's agents-core check in place.
      - name: chore siblings
        run: chore siblings
      - name: chore check
        run: chore check

  # Every guest a consumer can pin boots here, so one that cannot boot
  # fails before a release names it (#70).
  #
  # One gate for both legs of the matrix: they share the class linux-x64-kvm,
  # so each leg runs on the label this gate answers.
  smoke-x86_64-gate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick linux-x64-kvm

  smoke-x86_64:
    name: smoke (real VM, x86_64 KVM, ${{ matrix.guest }})
    needs: [changes, smoke-x86_64-gate]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.smoke-x86_64-gate.outputs.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        guest: [debian-12, debian-13]
    env:
      # The guest smoke.sh boots, and the guest whose box ci-setup-linux.sh
      # caches.
      FLTH_SMOKE_GUEST: ${{ matrix.guest }}
      FLTH_VM_GUEST: ${{ matrix.guest }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-chore
        with:
          version: ${{ env.CHORE_VERSION }}
      # Upstream virtiofsd 1.14.0, pinned by SHA-256 and named in
      # FLTH_VIRTIOFSD: Ubuntu's 1.10.0 panics in setxattr on an extended
      # attribute name that is not UTF-8 (#274). Before ci-setup-linux.sh,
      # whose host check refuses an older one. Every consumer's Linux job
      # uses the same action.
      - uses: ./.github/actions/install-virtiofsd
      # The same script every consumer's CI runs from its sibling
      # checkout: KVM access, QEMU, Vagrant and vagrant-qemu, pinned.
      - name: KVM, QEMU and Vagrant
        id: vm-host
        run: scripts/ci-setup-linux.sh
      # Restore only: box-cache.yml saves the entry from main, which every
      # pull request and merge queue run can read; a save here would sit on
      # this run's own ref, where no other queue run can (#148).
      - name: Restore the Vagrant box
        uses: actions/cache/restore@v4
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ steps.vm-host.outputs.box-cache-key }}
      - name: chore host:check
        run: chore host:check
      - name: chore smoke
        run: chore smoke
      - name: Collect results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-x86_64-${{ matrix.guest }}-results
          path: tests/smoke-consumer/.vm-share/results
          if-no-files-found: ignore

  # The guest booted with software emulation (FLTH_ACCELERATOR=tcg) on our
  # x86_64 runner, which has no KVM: an x86_64 guest, and an emulated ARM64
  # guest (FLTH_GUEST_ARCH=aarch64), each booted through the harness with the
  # smoke consumer's setup, and asked for its architecture. The runner's pod is
  # small, so the TCG cache and guest RAM are capped. One gate for both legs:
  # they share the class linux-x64.
  smoke-tcg-gate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick linux-x64

  smoke-tcg:
    name: smoke (real VM, TCG, ${{ matrix.arch }} guest on x86_64)
    needs: [changes, smoke-tcg-gate]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.smoke-tcg-gate.outputs.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      FLTH_ACCELERATOR: tcg
      FLTH_GUEST_ARCH: ${{ matrix.arch }}
      FLTH_VM_MEM: "256"
      FLTH_GUEST_MEM: "192"
      FLTH_SHARED_CPUS: "2"
      FLTH_VM_GUEST: debian-12
      FLTH_CONFIG: ${{ github.workspace }}/tests/smoke-consumer/fs-linux-test-harness.toml
    steps:
      - uses: actions/checkout@v4
      # Our runner's image carries less than GitHub's: what the runner setup
      # and the harness call.
      - name: Host tools for our runner
        if: runner.environment == 'self-hosted'
        run: |
          sudo -n apt-get update -qq
          sudo -n apt-get install -y --no-install-recommends ruby perl jq procps lsof curl gnupg lsb-release unzip openssh-client ca-certificates
      - uses: ./.github/actions/install-chore
        with:
          version: ${{ env.CHORE_VERSION }}
      - uses: ./.github/actions/install-virtiofsd
      - name: QEMU and Vagrant, without KVM
        id: vm-host
        run: scripts/ci-setup-linux.sh
      - name: Restore the Vagrant box
        uses: actions/cache/restore@v4
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ steps.vm-host.outputs.box-cache-key }}
      - name: chore host:check
        run: chore host:check
      - name: Boot the guest and ask its architecture
        env:
          WANT: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          started=$(date +%s)
          got="$(scripts/vm.sh run uname -m | tr -d '\r' | tail -n 1)"
          echo "guest uname -m: $got (after $(( $(date +%s) - started ))s)"
          if [ "$got" != "$WANT" ]; then
            echo "::error::the guest is $got, not $WANT"
            exit 1
          fi
      - name: Destroy the guest
        if: always()
        run: scripts/vm.sh destroy || true

  # ci-ok-gate picks only ci-ok's runner. Like ci-ok it runs whatever became
  # of the jobs before it, and ci-ok falls back to GitHub's runner when it
  # answered nothing.
  ci-ok-gate:
    if: always()
    needs: [changes-gate, changes, unit-linux-gate, unit-linux, unit-macos-gate, unit-macos, smoke-x86_64-gate, smoke-x86_64, smoke-tcg-gate, smoke-tcg]
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick linux-x64

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes-gate, changes, unit-linux-gate, unit-linux, unit-macos-gate, unit-macos, smoke-x86_64-gate, smoke-x86_64, smoke-tcg-gate, smoke-tcg, ci-ok-gate]
    runs-on: ${{ needs.ci-ok-gate.outputs.runner || 'ubuntu-latest' }}
    steps:
      - name: jq for our runner
        if: runner.environment == 'self-hosted'
        run: command -v jq >/dev/null || { sudo -n apt-get update -qq && sudo -n apt-get install -y --no-install-recommends jq; }
      - name: Every job ran and succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          # false only for a change to documentation alone: then, and only
          # then, a skipped job is not a failed one.
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "code changed: $CODE"
          bad="$(echo "$NEEDS" | jq -r --arg code "$CODE" '[to_entries[] | select(.value.result != "success" and ($code != "false" or .value.result != "skipped")) | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::not green: $bad (failed, cancelled or skipped)"
            exit 1
          fi
          echo "all required jobs succeeded"

  release-gate:
    needs: ci-ok
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick linux-x64

  release:
    name: release (publish the version tag)
    needs: [ci-ok, release-gate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ needs.release-gate.outputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # scripts/release.sh calls gh and jq, which our runner's image may lack.
      - name: gh and jq for our runner
        if: runner.environment == 'self-hosted'
        run: |
          if ! command -v gh >/dev/null || ! command -v jq >/dev/null; then
            sudo -n apt-get update -qq
            sudo -n apt-get install -y --no-install-recommends gh jq
          fi
      - name: Publish the tagged CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: 1
        run: scripts/release.sh "$GITHUB_REF_NAME"
