name: kvm-probe

# Does a GitHub-hosted runner expose KVM? Manual, and not a gate: the
# answer decides whether a smoke job can run there. As of 2026-09-17:
# ubuntu-latest (x86_64) has /dev/kvm; ubuntu-24.04-arm has none, so the
# arm64 path is proven by `chore smoke` on an arm64 host instead.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Look for /dev/kvm
        run: |
          uname -a
          grep -m1 -iE 'model name|CPU implementer' /proc/cpuinfo || true
          ls -l /dev/kvm 2>&1 || true
          if [ -e /dev/kvm ]; then
            sudo mkdir -p /etc/udev/rules
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules/99-kvm4all.rules >/dev/null
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          fi
          if [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "::notice::${{ matrix.runner }}: /dev/kvm is present and usable"
          else
            echo "::notice::${{ matrix.runner }}: no usable /dev/kvm"
          fi
          lsmod | grep -i kvm || echo "no kvm modules loaded"

  # Why the pinned Debian 13 box does not boot on the KVM runner (#70): the
  # box's own disk under plain QEMU, once per CPU model, with QEMU logging
  # each reset and guest error, so the first boot's console and the CPU
  # state it reset in are both in the log.
  debian-13-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: KVM, QEMU and Vagrant
        run: scripts/ci-setup-linux.sh
      - name: Fetch the pinned boxes
        run: |
          for guest in debian-12 debian-13; do
            ver="$(sed -n "s/.*\"$guest\" => \[\"cloud-image\/$guest\", \"\([^\"]*\)\"\].*/\1/p" vagrant/Vagrantfile)"
            vagrant box add "cloud-image/$guest" --box-version "$ver" --provider libvirt
          done
          find ~/.vagrant.d/boxes -type f | xargs ls -l
      - name: Boot each box under each CPU model
        run: |
          set +e
          qemu-system-x86_64 --version | head -1
          grep -m1 'model name' /proc/cpuinfo
          for guest in debian-12 debian-13; do
            img="$(find ~/.vagrant.d/boxes -path "*$guest*" -name '*.img' | head -1)"
            qemu-img info "$img" | head -6
            for cpu in host max qemu64 EPYC-v4; do
              tag="$guest-$cpu"
              qemu-img create -q -f qcow2 -F qcow2 -b "$img" "/tmp/$tag.qcow2"
              timeout 90 qemu-system-x86_64 -machine q35,accel=kvm -cpu "$cpu" -m 2G -smp 2 \
                -display none -monitor none -serial "file:/tmp/$tag.serial" \
                -drive "file=/tmp/$tag.qcow2,if=virtio" -no-reboot \
                -d guest_errors,cpu_reset -D "/tmp/$tag.qemu" 2>&1 | tail -5
              echo "::group::$tag: exit $? (124 = still running at 90 s, i.e. booted)"
              echo "-- serial (first 60 lines, tr'd)"
              tr -d '\033' < "/tmp/$tag.serial" | tr '\r' '\n' | grep -v '^\s*$' | head -60
              echo "-- qemu log: resets and errors"
              grep -c 'CPU Reset' "/tmp/$tag.qemu"
              grep -iE 'triple|fault|error' "/tmp/$tag.qemu" | head -10
              tail -30 "/tmp/$tag.qemu"
              echo "::endgroup::"
            done
          done
