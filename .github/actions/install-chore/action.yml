name: Install chore
description: Download a pinned chore release and verify it against the release's checksums.
inputs:
  version:
    description: chore version, without the leading v
    required: true
  token:
    description: token for the GitHub REST API, used only when the release download fails
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CHORE_VERSION: ${{ inputs.version }}
        CHORE_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) arch=x86_64 ;;
          aarch64 | arm64) arch=arm64 ;;
          *) echo "no chore build for $(uname -m)" >&2; exit 1 ;;
        esac
        os="$(uname -s | tr '[:upper:]' '[:lower:]')"
        tarball="chore-${CHORE_VERSION}-${os}-${arch}.tar.gz"
        base="https://github.com/antimatter-studios/chore/releases/download/v${CHORE_VERSION}"
        api="https://api.github.com/repos/antimatter-studios/chore/releases"
        dir="$RUNNER_TEMP/chore"
        mkdir -p "$dir"
        release=""
        # fetch <asset>: GitHub's release download answers an occasional HTTP
        # 500, and on 2026-11-09 answered 504 to every attempt for minutes, so
        # every download retries on any error and names the host that answered
        # last. Once the release download's retries are spent, the same asset
        # comes through the REST API's asset endpoint, with the job's token,
        # which curl does not pass on to the storage host it redirects to.
        # Either way the checksum check below guards what was fetched.
        fetch() {
          if curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
              --write-out '%{stderr}%{http_code} from %{urle.host}\n' \
              -o "$dir/$1" "$base/$1"; then
            return 0
          fi
          echo "::warning::the release download of $1 failed after its retries; fetching it through the GitHub REST API" >&2
          if [ -z "$release" ]; then
            release="$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
              --write-out '%{stderr}%{http_code} from %{urle.host}\n' \
              -H "Authorization: Bearer $CHORE_TOKEN" -H "Accept: application/vnd.github+json" \
              "$api/tags/v${CHORE_VERSION}")" || { echo "the REST API lookup of release v${CHORE_VERSION} failed" >&2; exit 1; }
          fi
          # The asset's own API url, which comes before its name in each asset.
          # awk reads to the end, so no writer in the pipe dies of SIGPIPE.
          url="$(printf '%s\n' "$release" | tr ',{}[]' '\n\n\n\n\n' | awk -v want="$1" '
            { sub(/^[ \t]+/, ""); sub(/[ \t]+$/, "") }
            /^"url": *"https:\/\/api\.github\.com\/repos\/antimatter-studios\/chore\/releases\/assets\/[0-9]+"$/ {
              u = $0; sub(/^"url": *"/, "", u); sub(/"$/, "", u)
            }
            /^"name": *"/ { n = $0; sub(/^"name": *"/, "", n); sub(/"$/, "", n); if (n == want && u != "" && !found) { print u; found = 1 } }
          ')"
          [ -n "$url" ] || { echo "release v${CHORE_VERSION} has no asset named $1" >&2; exit 1; }
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            --write-out '%{stderr}%{http_code} from %{urle.host}\n' \
            -H "Authorization: Bearer $CHORE_TOKEN" -H "Accept: application/octet-stream" \
            -o "$dir/$1" "$url"
        }
        fetch "$tarball"
        fetch checksums.txt
        (cd "$dir" && grep " ${tarball}\$" checksums.txt | sha256sum -c -)
        tar -xzf "$dir/$tarball" -C "$dir"
        bin="$(find "$dir" -type f -name chore -perm -u+x | head -1)"
        [ -n "$bin" ] || { echo "no chore binary in $tarball" >&2; exit 1; }
        mkdir -p "$HOME/.local/bin"
        install -m 0755 "$bin" "$HOME/.local/bin/chore"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/chore" --version
