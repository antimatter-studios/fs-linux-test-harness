name: Install chore
description: Install a pinned chore release, verified against the SHA-256 committed here, from the cache or the release.
inputs:
  version:
    description: chore version, without the leading v
    required: true
  token:
    description: token for the GitHub REST API, used only when the release download fails
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    # The SHA-256 of every platform's tarball, for each chore version CI pins,
    # is committed here: the root of trust is this repository, not the
    # release's own checksums.txt, which lives on the same storage host as the
    # tarball and so is unavailable in the same outage (#212). A version with
    # no pinned hash for this platform fails here, before anything downloads.
    #
    # To bump chore: download the new release's tarballs once
    # (`gh release download v<new> -R antimatter-studios/chore`), check that
    # `sha256sum chore-*.tar.gz` agrees with its checksums.txt, then replace
    # the lines below with one line per platform tarball and change
    # CHORE_VERSION in .github/workflows/ci.yml. tests/install-chore.sh fails
    # while any platform of the pinned version has no hash here.
    - id: pin
      shell: bash
      env:
        CHORE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) arch=x86_64 ;;
          aarch64 | arm64) arch=arm64 ;;
          *) echo "no chore build for $(uname -m)" >&2; exit 1 ;;
        esac
        os="$(uname -s | tr '[:upper:]' '[:lower:]')"
        tarball="chore-${CHORE_VERSION}-${os}-${arch}.tar.gz"
        sha256=""
        while read -r hash name; do
          if [ "$name" = "$tarball" ]; then sha256="$hash"; fi
        done <<'PINNED'
        f15057391789b0e1946da9b6f08ffd1b2a98eda9ec753e4a11bac564f55ef2e4  chore-0.11.0-darwin-arm64.tar.gz
        bd78231e780209566a24794cb131de5e9d4c2d23a256bce6e6f1ba53d67e7bea  chore-0.11.0-darwin-x86_64.tar.gz
        77c47ed2171ddc7542eb0f0c0dbf550ab41dfe370cebc3eb6900b18cb6552d3d  chore-0.11.0-linux-arm64.tar.gz
        0616bf7f7e21f1b3b951161c35c56da17eb59fcb7e59e90f8aa8ef32f1f2ff2c  chore-0.11.0-linux-x86_64.tar.gz
        PINNED
        if ! printf '%s\n' "$sha256" | grep -qE '^[0-9a-f]{64}$'; then
          echo "::error::no pinned SHA-256 for $tarball in .github/actions/install-chore/action.yml; a chore version bump must add the hash of every platform's tarball there" >&2
          exit 1
        fi
        {
          echo "tarball=$tarball"
          echo "sha256=$sha256"
          echo "dir=$RUNNER_TEMP/chore-cache"
          echo "key=chore-$tarball-$sha256"
        } >> "$GITHUB_OUTPUT"
    # A copy kept by an earlier run, so an outage of the release storage does
    # not stop the job. It is checked against the pinned hash like a download.
    # An entry saved from main serves every ref; one saved from a pull request
    # or a merge queue group serves only that ref's reruns.
    - id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.pin.outputs.dir }}
        key: ${{ steps.pin.outputs.key }}
    - id: install
      shell: bash
      env:
        CHORE_VERSION: ${{ inputs.version }}
        CHORE_TOKEN: ${{ inputs.token }}
        CHORE_TARBALL: ${{ steps.pin.outputs.tarball }}
        CHORE_SHA256: ${{ steps.pin.outputs.sha256 }}
        CHORE_CACHE_DIR: ${{ steps.pin.outputs.dir }}
      run: |
        set -euo pipefail
        tarball="$CHORE_TARBALL"
        case "$CHORE_SHA256" in
          "" | *[!0-9a-f]*) echo "no pinned SHA-256 for $tarball" >&2; exit 1 ;;
        esac
        base="https://github.com/antimatter-studios/chore/releases/download/v${CHORE_VERSION}"
        api="https://api.github.com/repos/antimatter-studios/chore/releases"
        dir="$RUNNER_TEMP/chore"
        mkdir -p "$dir"
        release=""
        # try <asset>: one attempt at each path. GitHub's release download
        # answers an occasional HTTP 500, and on 2026-11-09 answered 504 to
        # every attempt for minutes, so each download retries on any error and
        # names the host that answered last. Once the release download's
        # retries are spent, the same asset comes through the REST API's asset
        # endpoint, with the job's token, which curl does not pass on to the
        # storage host it redirects to. Either way the pinned hash below
        # guards what was fetched.
        try() {
          if curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
              --write-out '%{stderr}%{http_code} from %{urle.host}\n' \
              -o "$dir/$1" "$base/$1"; then
            return 0
          fi
          echo "::warning::the release download of $1 failed after its retries; fetching it through the GitHub REST API" >&2
          if [ -z "$release" ]; then
            release="$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
              --write-out '%{stderr}%{http_code} from %{urle.host}\n' \
              -H "Authorization: Bearer $CHORE_TOKEN" -H "Accept: application/vnd.github+json" \
              "$api/tags/v${CHORE_VERSION}")" || { release=""; echo "the REST API lookup of release v${CHORE_VERSION} failed" >&2; return 1; }
          fi
          # The asset's own API url, which comes before its name in each asset.
          # awk reads to the end, so no writer in the pipe dies of SIGPIPE.
          url="$(printf '%s\n' "$release" | tr ',{}[]' '\n\n\n\n\n' | awk -v want="$1" '
            { sub(/^[ \t]+/, ""); sub(/[ \t]+$/, "") }
            /^"url": *"https:\/\/api\.github\.com\/repos\/antimatter-studios\/chore\/releases\/assets\/[0-9]+"$/ {
              u = $0; sub(/^"url": *"/, "", u); sub(/"$/, "", u)
            }
            /^"name": *"/ { n = $0; sub(/^"name": *"/, "", n); sub(/"$/, "", n); if (n == want && u != "" && !found) { print u; found = 1 } }
          ')"
          [ -n "$url" ] || { echo "release v${CHORE_VERSION} has no asset named $1" >&2; exit 1; }
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            --write-out '%{stderr}%{http_code} from %{urle.host}\n' \
            -H "Authorization: Bearer $CHORE_TOKEN" -H "Accept: application/octet-stream" \
            -o "$dir/$1" "$url"
        }
        # fetch <asset>: both paths redirect to the same storage host, so an
        # outage there fails both at once (#212). curl's retries span seconds,
        # and the 2026-11-09 outage lasted minutes, so when both paths fail the
        # action waits and tries both again, six minutes in all, before the job
        # fails. A missing asset still fails at once.
        fetch() {
          local wait
          for wait in 60 120 180 ""; do
            if try "$1"; then return 0; fi
            [ -n "$wait" ] || break
            echo "::warning::both paths to $1 failed; trying both again in ${wait}s" >&2
            sleep "$wait"
          done
          echo "every attempt at $1 failed, by the release download and by the REST API" >&2
          exit 1
        }
        # verify: the tarball in $dir matches its pinned SHA-256, or the job
        # fails here. A mismatch never falls through to another source.
        verify() {
          (cd "$dir" && printf '%s  %s\n' "$CHORE_SHA256" "$tarball" | sha256sum -c -) && return 0
          echo "::error::$1 $tarball does not match its pinned SHA-256 $CHORE_SHA256" >&2
          exit 1
        }
        if [ -f "$CHORE_CACHE_DIR/$tarball" ]; then
          echo "$tarball comes from the cache"
          cp "$CHORE_CACHE_DIR/$tarball" "$dir/$tarball"
          verify "the cached"
        else
          fetch "$tarball"
          verify "the downloaded"
          mkdir -p "$CHORE_CACHE_DIR"
          cp "$dir/$tarball" "$CHORE_CACHE_DIR/$tarball"
        fi
        tar -xzf "$dir/$tarball" -C "$dir"
        bin="$(find "$dir" -type f -name chore -perm -u+x | head -1)"
        [ -n "$bin" ] || { echo "no chore binary in $tarball" >&2; exit 1; }
        mkdir -p "$HOME/.local/bin"
        install -m 0755 "$bin" "$HOME/.local/bin/chore"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/chore" --version
    # Saved only once its tarball passed the pinned hash in the step above.
    - if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.pin.outputs.dir }}
        key: ${{ steps.pin.outputs.key }}
