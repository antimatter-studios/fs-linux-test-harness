# A third smoke consumer, for the one promise the others cannot test without
# waiting two hours: a deadline so short that the guest refuses new logins from
# the moment it is scheduled (tests/smoke.sh).

[project]
name = "flth-smoke-deadline"

[vm]
memory = "2G"
cpus = 2
disk = "16G"
ssh_port = 50124
deadline_minutes = 5

[share]
dir = ".vm-share"

[setup]
script = "setup.sh"
