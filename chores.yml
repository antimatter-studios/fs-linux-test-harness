version: "3"
chore_min_version: 0.10.0

# THE HARNESS'S OWN TASKS. Consumers do not use this file; they include
# vm.chores.yml (see README.md). These are what CI runs, so a green local
# `chore check && chore smoke` is the same evidence as a green pipeline.

# The smoke run's shared guest is in a cache directory of its own
# (tests/smoke.sh), so these name it too. The reaper stops a smoke boot
# that did not finish. Fails soft, as a net should.
lifecycle:
  after_all:
    - 'FLTH_CACHE_DIR="{{.SMOKE_CACHE_DIR}}" FLTH_CONFIG=tests/smoke-consumer/fs-linux-test-harness.toml ./scripts/vm.sh reap'

vars:
  # The one sibling: rust-fs-core, whose family scripts this repository runs
  # in place rather than keeping copies of. A URL beside the ref, so nothing
  # rebuilds one from a repo name.
  FS_CORE_URL: https://github.com/antimatter-studios/rust-fs-core.git
  FS_CORE_REF: v0.3.12
  # Where tests/smoke.sh keeps its machine, apart from the shared guest this
  # host's consumers use. tests/smoke.sh has the same default.
  SMOKE_CACHE_DIR: '${FLTH_SMOKE_CACHE_DIR:-${XDG_CACHE_HOME:-$HOME/.cache}/fs-linux-test-harness-smoke}'

tasks:
  siblings:
    desc: Check out ../rust-fs-core at FS_CORE_REF, whose agents-core check `chore check` runs in place
    cmds:
      - |
        set -eu
        if [ -e ../rust-fs-core ]; then
          echo "siblings: ../rust-fs-core is already checked out, left alone"
        else
          git clone --quiet --depth 1 --branch '{{.FS_CORE_REF}}' '{{.FS_CORE_URL}}' ../rust-fs-core
        fi

  check:
    desc: 'VM-free self-test: bash -n, shellcheck, and every unit test (CI job: unit)'
    cmds: ['./tests/run.sh']

  smoke:
    desc: 'Boot a real VM and drive the whole harness through it (CI jobs: smoke-*). Needs KVM or HVF.'
    # A hung boot or a guest that never answers must not hold the VM for
    # ever; the smoke script destroys its VM on every exit path, and this
    # is the net for the one where it never exits. The smoke consumers all
    # use the one shared machine, so one destroy covers them.
    timeout: 60m
    on_timeout:
      - cmd: 'FLTH_CACHE_DIR="{{.SMOKE_CACHE_DIR}}" FLTH_CONFIG=tests/smoke-consumer/fs-linux-test-harness.toml ./scripts/vm.sh destroy'
      - cmd: 'for g in $TIMEOUT_PGID; do kill -TERM -"$g" 2>/dev/null || true; done'
    cmds: ['./tests/smoke.sh']

  smoke:destroy:
    desc: Delete the smoke run's shared guest and its disk
    cmds: ['FLTH_CACHE_DIR="{{.SMOKE_CACHE_DIR}}" FLTH_CONFIG=tests/smoke-consumer/fs-linux-test-harness.toml ./scripts/vm.sh destroy']

  host:check:
    desc: Check this host can run the VM, and print what to install if not
    cmds: ['./scripts/host-tools.sh']
